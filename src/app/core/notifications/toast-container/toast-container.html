<div class="toast-stack">
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast toast--{{ toast.type }}"
      [class.toast--leaving]="isLeaving(toast.id)"
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
      [attr.aria-live]="toast.type === 'error' ? 'assertive' : 'polite'"
    >
      <span class="toast__icon" aria-hidden="true">
        @switch (toast.type) {
          @case ('success') {
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 8.4l2.6 2.6L12 5.4" />
            </svg>
          }
          @case ('error') {
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 5l6 6M11 5l-6 6" />
            </svg>
          }
          @case ('info') {
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="7.2" x2="8" y2="11.4" />
              <circle cx="8" cy="4.6" r="0.6" fill="currentColor" stroke="none" />
            </svg>
          }
        }
      </span>

      <div class="toast__body">
        <p class="toast__title">
          @switch (toast.type) {
            @case ('success') { Succès }
            @case ('error') { Erreur }
            @case ('info') { Information }
          }
        </p>
        <p class="toast__message">{{ toast.message }}</p>
      </div>

      <button
        class="toast__close"
        type="button"
        aria-label="Fermer la notification"
        (click)="close(toast.id)"
      >
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" />
        </svg>
      </button>

      <span
        class="toast__progress"
        [style.animation-duration.ms]="toast.duration"
        (animationend)="close(toast.id)"
        aria-hidden="true"
      ></span>
    </div>
  }
</div>
