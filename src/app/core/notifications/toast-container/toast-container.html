<div class="toast-stack">
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast toast--{{ toast.type }}"
      [class.toast--leaving]="isLeaving(toast.id)"
      [attr.role]="toast.type === 'error' ? 'alert' : 'status'"
      [attr.aria-live]="toast.type === 'error' ? 'assertive' : 'polite'"
    >
      <span class="toast-icon" aria-hidden="true">
        @switch (toast.type) {
          @case ('success') {
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="8" r="6.25" />
              <path d="M5.4 8.2l1.8 1.8 3.4-3.8" />
            </svg>
          }
          @case ('error') {
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 2.4 14.2 13.2H1.8L8 2.4Z" />
              <line x1="8" y1="6.6" x2="8" y2="9.4" />
              <circle cx="8" cy="11.3" r="0.55" fill="currentColor" stroke="none" />
            </svg>
          }
          @case ('info') {
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="8" r="6.25" />
              <line x1="8" y1="7.4" x2="8" y2="11" />
              <circle cx="8" cy="4.9" r="0.55" fill="currentColor" stroke="none" />
            </svg>
          }
        }
      </span>

      <p class="toast-message">{{ toast.message }}</p>

      <button
        class="toast-dismiss"
        type="button"
        aria-label="Fermer"
        (click)="close(toast.id)"
      >
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" />
        </svg>
      </button>

      <span
        class="toast-progress"
        [style.animation-duration.ms]="toast.duration"
        (animationend)="close(toast.id)"
        aria-hidden="true"
      ></span>
    </div>
  }
</div>
