<!-- Indicateur discret : barre fine en haut pendant les requêtes de fond -->
@if (loading.pending()) {
  <div class="loading-bar" aria-hidden="true"></div>
}

<!-- Overlay bloquant : fond flouté/assombri + spinner centré -->
@if (loading.blocking()) {
  <div
    class="loading-overlay"
    role="status"
    aria-busy="true"
    aria-live="polite"
  >
    <app-spinner [size]="48" label="Chargement…" class="loading-overlay__spinner" />
  </div>
}
