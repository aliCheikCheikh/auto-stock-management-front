<!-- Indicateur discret : barre fine en haut pendant les requêtes de fond -->
@if (loading.pending()) {
  <div class="loading-bar" aria-hidden="true"></div>
}

<!-- Overlay bloquant : fond flouté/assombri + spirale de points, centré -->
@if (loading.blocking()) {
  <div
    class="loading-overlay"
    role="status"
    aria-busy="true"
    aria-live="polite"
  >
    <div class="loading-overlay__spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <p class="loading-overlay__label">Chargement…</p>
  </div>
}
