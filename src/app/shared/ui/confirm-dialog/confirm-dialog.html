<!--
  Modal de confirmation réutilisable.
  Contrat (porté par confirm-dialog.ts) :
    entrées  : title(), message(), confirmLabel() = « Confirmer », cancelLabel() = « Annuler »
    sorties  : confirmed, cancelled
  Backdrop / Échap → cancelled.emit().
  L'habillage vient du gabarit .dialog-* du design system (styles.scss).
-->
<div
  class="dialog-backdrop"
  (click)="cancel()"
  (keydown.escape)="cancel()"
>
  <div
    #dialog
    class="dialog-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cd-title"
    [attr.aria-describedby]="errorMessage() ? 'cd-message cd-error' : 'cd-message'"
    (click)="$event.stopPropagation()"
    (keydown)="trapFocus(dialog, $event)"
  >
    <h2 class="dialog-title" id="cd-title">{{ title() }}</h2>
    <p class="dialog-message" id="cd-message">{{ message() }}</p>

    @if (errorMessage()) {
      <p class="dialog-error" id="cd-error" role="alert">{{ errorMessage() }}</p>
    }

    <div class="dialog-actions">
      <button
        class="btn btn--secondary"
        type="button"
        (click)="cancel()"
        [disabled]="isSubmitting()"
        autofocus
      >
        {{ cancelLabel() }}
      </button>
      <button
        class="btn"
        [class.btn--danger]="confirmTone() === 'danger'"
        [class.btn--primary]="confirmTone() === 'primary'"
        type="button"
        (click)="confirm()"
        [disabled]="isSubmitting()"
        [attr.aria-busy]="isSubmitting()"
      >
        @if (isSubmitting()) { Traitement… } @else { {{ confirmLabel() }} }
      </button>
    </div>
  </div>
</div>
