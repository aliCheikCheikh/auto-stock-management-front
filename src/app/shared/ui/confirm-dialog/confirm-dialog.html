<!--
  Modal de confirmation réutilisable.
  Contrat (porté par confirm-dialog.ts) :
    entrées  : title(), message(), confirmLabel() = « Confirmer », cancelLabel() = « Annuler »
    sorties  : confirmed, cancelled
  Backdrop / Échap → cancelled.emit().
  L'habillage vient du gabarit .dialog-* du design system (styles.scss).
-->
<div
  class="dialog-backdrop"
  (click)="cancelled.emit()"
  (keydown.escape)="cancelled.emit()"
>
  <div
    class="dialog-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cd-title"
    aria-describedby="cd-message"
    (click)="$event.stopPropagation()"
  >
    <h2 class="dialog-title" id="cd-title">{{ title() }}</h2>
    <p class="dialog-message" id="cd-message">{{ message() }}</p>

    <div class="dialog-actions">
      <button
        class="btn btn--secondary"
        type="button"
        (click)="cancelled.emit()"
        autofocus
      >
        {{ cancelLabel() }}
      </button>
      <button
        class="btn btn--danger"
        type="button"
        (click)="confirmed.emit()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
