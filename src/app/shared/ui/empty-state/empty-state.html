<div class="empty-state">
  <div class="empty-state__illustration" aria-hidden="true">
    @switch (illustration()) {
      @case ('products') {
        <svg viewBox="0 0 160 120" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path class="es-stroke" d="M48 56 80 44 112 56 112 92 80 104 48 92Z" />
          <path class="es-stroke" d="M48 56 80 68 112 56M80 68 80 104" />
          <rect class="es-accent" x="66" y="72" width="28" height="11" rx="2" />
        </svg>
      }
      @case ('sales') {
        <svg viewBox="0 0 160 120" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path class="es-stroke" d="M58 30 H102 V92 l-6 6 -6 -6 -6 6 -6 -6 -6 6 -6 -6 -6 6 V30Z" />
          <path class="es-stroke" d="M68 46 H92M68 58 H92" />
          <path class="es-accent" d="M68 70 H88" />
        </svg>
      }
      @case ('movements') {
        <svg viewBox="0 0 160 120" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <rect class="es-stroke" x="32" y="58" width="36" height="32" rx="3" />
          <rect class="es-stroke" x="92" y="58" width="36" height="32" rx="3" />
          <path class="es-accent" d="M72 68 H88M88 68 82 63M88 68 82 73" />
          <path class="es-accent" d="M88 82 H72M72 82 78 77M72 82 78 87" />
        </svg>
      }
      @case ('sellers') {
        <svg viewBox="0 0 160 120" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <circle class="es-stroke" cx="76" cy="52" r="14" />
          <path class="es-stroke" d="M52 96a24 24 0 0 1 48 0" />
          <circle class="es-accent" cx="104" cy="44" r="11" />
          <path class="es-accent" d="M104 39 V49M99 44 H109" />
        </svg>
      }
      @case ('search') {
        <svg viewBox="0 0 160 120" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path class="es-stroke" d="M50 44 H92M50 56 H92M50 68 H74" />
          <circle class="es-accent" cx="96" cy="74" r="16" />
          <path class="es-accent" d="M108 86 120 98" />
        </svg>
      }
      @case ('error') {
        <svg viewBox="0 0 160 120" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path class="es-stroke" d="M48 56 80 44 112 56 112 92 80 104 48 92Z" />
          <path class="es-stroke" d="M48 56 80 68 112 56M80 68 80 104" />
          <path class="es-accent" d="M80 74 V86M80 95 80 95.5" />
        </svg>
      }
    }
  </div>

  <p class="empty-state__title">{{ title() }}</p>
  @if (text()) {
    <p class="empty-state__text">{{ text() }}</p>
  }
  <div class="empty-state__action">
    <ng-content />
  </div>
</div>
