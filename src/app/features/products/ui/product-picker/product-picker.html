<div class="product-picker" (keydown)="onKeydown($event)">
  <span class="product-picker__icon" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="7" r="4.5" />
      <path d="M10.5 10.5 14 14" />
    </svg>
  </span>

  <input
    [attr.id]="inputId()"
    [attr.data-global-search]="global() ? '' : null"
    class="product-picker__input"
    [formControl]="searchControl"
    type="search"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    role="combobox"
    aria-autocomplete="list"
    aria-haspopup="grid"
    aria-controls="product-picker-results"
    [attr.aria-expanded]="showDropdown()"
    [attr.aria-activedescendant]="activeIndex() >= 0 ? 'product-picker-option-' + activeIndex() : null"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />

  @if (showDropdown()) {
    <div class="product-picker__panel">
      @if (results().length > 0) {
        <div class="product-picker__results">
          <table
            class="data-grid product-picker__grid"
            id="product-picker-results"
            role="grid"
            aria-label="Résultats de recherche"
          >
            <colgroup>
              <col class="product-picker__name-col" />
              <col class="product-picker__reference-col" />
              <col class="product-picker__price-col" />
            </colgroup>
            <thead>
              <tr>
                <th scope="col">Produit</th>
                <th scope="col">Référence</th>
                <th scope="col" class="data-grid__num">Prix</th>
              </tr>
            </thead>
            <tbody>
              @for (item of results(); track item.productId; let i = $index) {
              <tr
                class="product-picker__option"
                [class.is-active]="i === activeIndex()"
                id="product-picker-option-{{ i }}"
                role="row"
                [attr.aria-selected]="i === activeIndex()"
                (mousedown)="$event.preventDefault()"
                (mouseenter)="activeIndex.set(i)"
                (click)="select(item)"
              >
                <td class="product-picker__name" role="gridcell">{{ item.name }}</td>
                <td class="product-picker__ref" role="gridcell">{{ item.reference }}</td>
                <td class="product-picker__price data-grid__num" role="gridcell">{{ item.unitPrice | money }}</td>
              </tr>
              }
            </tbody>
          </table>
        </div>
      } @else if (showEmpty()) {
        <div class="product-picker__empty" role="status">
          <svg class="product-picker__empty-icon" viewBox="0 0 32 32" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path class="es-stroke" d="M6 10h13M6 16h13M6 22h7" />
            <circle class="es-accent" cx="21" cy="21" r="6" />
            <path class="es-accent" d="M25.5 25.5 29 29" />
          </svg>
          <span>Aucun produit trouvé</span>
        </div>
      }
    </div>
  }
</div>
