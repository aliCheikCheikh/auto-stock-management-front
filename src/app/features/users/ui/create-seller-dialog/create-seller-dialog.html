<div class="dialog-backdrop" (click)="cancel()" (keydown.escape)="cancel()">
  <section
    #dialog
    class="dialog-card user-form-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="create-seller-title"
    [attr.aria-describedby]="generalError() ? 'create-seller-description create-seller-error' : 'create-seller-description'"
    (click)="$event.stopPropagation()"
    (keydown)="trapFocus(dialog, $event)"
  >
    <h2 class="dialog-title" id="create-seller-title">Ajouter un vendeur</h2>
    <p class="dialog-message" id="create-seller-description">
      Le vendeur utilisera son email pour se connecter. Le système générera son premier mot de passe.
    </p>

    <form class="user-dialog-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="seller-display-name">Nom affiché</label>
        <input
          id="seller-display-name"
          type="text"
          formControlName="displayName"
          maxlength="100"
          autocomplete="name"
          autofocus
          [attr.aria-invalid]="displayNameError() ? true : null"
          [attr.aria-describedby]="displayNameError() ? 'seller-display-name-error' : null"
        />
        @if (displayNameError(); as error) {
          <p class="field-error" id="seller-display-name-error">{{ error }}</p>
        }
      </div>

      <div class="field">
        <label for="seller-email">Email de connexion</label>
        <input
          id="seller-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="emailError() ? true : null"
          [attr.aria-describedby]="emailError() ? 'seller-email-error' : null"
        />
        @if (emailError(); as error) {
          <p class="field-error" id="seller-email-error">{{ error }}</p>
        }
      </div>

      @if (generalError()) {
        <p class="dialog-error" id="create-seller-error" role="alert">{{ generalError() }}</p>
      }

      <div class="dialog-actions">
        <button class="btn btn--secondary" type="button" [disabled]="isSubmitting()" (click)="cancel()">
          Annuler
        </button>
        <button
          class="btn btn--primary"
          type="submit"
          [disabled]="isSubmitting()"
          [attr.aria-busy]="isSubmitting()"
        >
          @if (isSubmitting()) { Création… } @else { Ajouter le vendeur }
        </button>
      </div>
    </form>
  </section>
</div>
