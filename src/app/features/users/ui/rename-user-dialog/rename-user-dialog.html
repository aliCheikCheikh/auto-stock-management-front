<div class="dialog-backdrop" (click)="cancel()" (keydown.escape)="cancel()">
  <section
    #dialog
    class="dialog-card rename-user-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="rename-user-title"
    (click)="$event.stopPropagation()"
    (keydown)="trapFocus(dialog, $event)"
  >
    <h2 class="dialog-title" id="rename-user-title">Renommer le compte</h2>
    <p class="dialog-message">L’email de connexion {{ user().email }} ne sera pas modifié.</p>

    <form class="rename-user-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="renamed-display-name">Nom affiché</label>
        <input
          id="renamed-display-name"
          type="text"
          formControlName="displayName"
          maxlength="100"
          autocomplete="name"
          autofocus
          [attr.aria-invalid]="displayNameError() ? true : null"
          [attr.aria-describedby]="displayNameError() ? 'renamed-display-name-error' : null"
        />
        @if (displayNameError(); as error) {
          <p class="field-error" id="renamed-display-name-error">{{ error }}</p>
        }
      </div>

      @if (generalError()) {
        <p class="dialog-error" role="alert">{{ generalError() }}</p>
      }

      <div class="dialog-actions">
        <button class="btn btn--secondary" type="button" [disabled]="isSubmitting()" (click)="cancel()">
          Annuler
        </button>
        <button class="btn btn--primary" type="submit" [disabled]="isSubmitting()" [attr.aria-busy]="isSubmitting()">
          @if (isSubmitting()) { Enregistrement… } @else { Enregistrer }
        </button>
      </div>
    </form>
  </section>
</div>
